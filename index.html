<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110c08">
<meta name="description" content="GOLD GLOBE — World gold spot reference prices by weight in USD.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://millionfilters.com/">
<title>GOLD GLOBE | World Gold</title>
<style>
:root{--gold:#f5d88b;--apple:#c9f477;--line:#edbd653d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -5%,#563615,#1b130c 31%,#08090b 82%);color:#fff5e2;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{width:min(100%,520px);margin:auto;padding:22px 14px 40px}
h1{margin:8px 0 5px;color:var(--gold);font-family:Georgia,serif;font-size:clamp(25px,6.4vw,34px);letter-spacing:.14em;text-shadow:0 2px 18px #d495312b}
.tag{color:#d0bfa1;font-size:11px;letter-spacing:.3em;margin-bottom:16px}
.panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;padding:18px 14px 18px;background:radial-gradient(ellipse at 50% 12%,#5e381b47,transparent 52%),linear-gradient(155deg,#24180f,#10100f 80%);box-shadow:0 20px 48px #0008}
.eyebrow{color:#f1d18a;font-size:11px;letter-spacing:.21em;margin-bottom:12px}
.bar-stage{position:relative;width:min(100%,440px);margin:0 auto 3px;filter:drop-shadow(0 15px 20px #0008);animation:bar-float 6s ease-in-out infinite;transform-origin:50% 55%}
.bar-stage img{display:block;width:100%;height:auto}
.bar-engrave{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:45%;pointer-events:none;display:flex;flex-direction:column;align-items:center;color:#6c3c09;text-shadow:0 1px 1px #fff3bb99,0 -1px 1px #8a520f75}
.bar-engrave .fine{font-family:Georgia,serif;font-size:clamp(9px,2.2vw,13px);font-weight:800;letter-spacing:.11em;white-space:nowrap}
.bar-engrave .weight{font-family:Georgia,serif;font-size:clamp(28px,8vw,44px);line-height:1.13;font-weight:900;white-space:nowrap}
.bar-engrave .purity{font-size:clamp(8px,2.1vw,11px);font-weight:850;letter-spacing:.07em;white-space:nowrap}
@keyframes bar-float{0%,100%{transform:translateY(1px) rotate(-.55deg)}50%{transform:translateY(-9px) rotate(.55deg)}}
.price-caption{color:var(--gold);font-size:11px;letter-spacing:.2em;margin-top:0}
.price{color:#fff2c5;font-size:clamp(35px,9vw,53px);font-weight:900;line-height:1.15;margin:10px 0 7px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.unit{color:#d8c9af;font-size:12px}.status{color:#b7a995;font-size:11px;margin:12px 0 0;line-height:1.7}
.weights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0 8px}
.weights button{min-height:47px;padding:9px 5px;border-radius:13px;border:1px solid #d8a75d66;background:linear-gradient(#30251c,#191510);color:#f8dfb1;font:800 13px inherit;cursor:pointer;font-size:13px;font-weight:800}
.weights button.active{background:linear-gradient(#fff1b5,#e6b952 55%,#c48b2b);color:#563609;border-color:#ffebad;box-shadow:0 4px 16px #cc9d4144}
.weights button:focus-visible,.share:focus-visible{outline:3px solid #fff1b5;outline-offset:3px}
.scene{position:relative;margin:2px -14px -18px;height:255px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 82%,#9c621b29,transparent 58%)}
.mountains{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;z-index:1;filter:drop-shadow(0 0 15px #dc9b2720)}
.earth-glow{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:220px;height:72px;background:radial-gradient(ellipse,#ffcc5f88,transparent 72%);filter:blur(15px);z-index:2}
.earth{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);width:190px;height:190px;object-fit:contain;z-index:3;filter:drop-shadow(0 0 14px #daa64b88) drop-shadow(0 7px 17px #0009)}
.scene:after{content:"";position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(transparent,#130d09bb);pointer-events:none;z-index:4}
.share{display:block;width:100%;min-height:58px;margin-top:18px;border:0;border-radius:18px;background:var(--apple);color:#1c2c0a;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 7px 24px #ade35d44}.share:active{transform:scale(.99)}
footer{margin-top:18px;color:#a2957e;font-size:10px;line-height:1.8}
@media(max-width:430px){.scene{height:225px}.earth{width:169px;height:169px}.weights button{font-size:12px}.bar-stage{width:100%}}
@media(prefers-reduced-motion:reduce){.bar-stage{animation:none}}
</style>
</head>
<body>
<main>
<h1>GOLD GLOBE</h1><div class="tag">WORLD GOLD</div>
<section class="panel">
 <div class="eyebrow">✦ LUXURY GOLD VIEW ✦</div>
 <div class="bar-stage">
  <img src="gold-bar-clean.webp" alt="Fine gold bullion bar" width="980" height="460">
  <div class="bar-engrave" aria-hidden="true">
   <span class="fine">FINE GOLD</span>
   <strong class="weight" id="barWeight">1 kg</strong>
   <span class="purity">999.9 · 24K</span>
  </div>
 </div>
 <div class="price-caption">GLOBAL GOLD PRICE</div>
 <div class="price" id="price" aria-live="polite">—</div>
 <div class="unit" id="unit">USD / 1 kg · 24K</div>
 <div class="status" id="status">Loading latest price…</div>
 <div class="weights" id="weights" aria-label="Choose gold weight"></div>
 <div class="scene" aria-label="Golden Earth and mountains">
  <img src="mountains-soft.webp" class="mountains" alt="Golden mountain landscape">
  <div class="earth-glow"></div>
  <img class="earth" src="earth-spin.webp" alt="Golden Earth rotating horizontally" width="320" height="320">
 </div>
</section>
<button class="share" id="share">↗ SHARE GOLD</button>
<footer>Indicative spot metal value · USD only<br>Not a retail buying or selling quote</footer>
</main>
<script>
const OUNCE=31.1034768;
const weights=[['1 kg',1000],['500 g',500],['250 g',250],['100 g',100],['50 g',50],['20 g',20],['10 g',10],['5 g',5],['1 g',1],['Ounce',OUNCE]];
let spot=null,grams=1000,selected='1 kg';
const el=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
for(const [label,g] of weights){
 const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.label=label;
 b.onclick=()=>{selected=label;grams=g;render()};el('weights').appendChild(b);
}
function render(){
 el('barWeight').textContent=selected;
 el('unit').textContent=selected==='Ounce'?'USD / TROY OUNCE · 24K':'USD / '+selected+' · 24K';
 el('price').textContent=spot===null?'—':money(spot*grams/OUNCE);
 el('weights').querySelectorAll('button').forEach(b=>{const a=b.dataset.label===selected;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))});
}
async function updatePrice(){
 try{
  const r=await fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'});
  if(!r.ok)throw Error('HTTP');
  const d=await r.json();const p=Number(d.price);
  if(!Number.isFinite(p)||p<=0)throw Error('Invalid price');
  spot=p;
  const date=d.updatedAt?new Date(d.updatedAt):null;
  el('status').textContent=date&&!isNaN(date.getTime())?'Updated: '+date.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'UTC'})+' UTC':'Latest available gold price';
 }catch(e){spot=null;el('status').textContent='Price unavailable · Refresh to retry'}
 render();
}
el('share').onclick=async()=>{
 const url=location.origin+location.pathname;
 const msg=spot===null?'✨ GOLD GLOBE':'✨ GOLD GLOBE\n'+selected+': '+money(spot*grams/OUNCE);
 try{if(navigator.share){await navigator.share({title:'GOLD GLOBE',text:msg,url});return}}catch(e){if(e.name==='AbortError')return}
 window.open('https://wa.me/?text='+encodeURIComponent(msg+'\n'+url),'_blank','noopener');
};
render();updatePrice();
// Do not substitute the current clock for the source's last-update timestamp.
</script>
</body>
</html>

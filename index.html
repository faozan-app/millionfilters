
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="description" content="Gold Globe — your gold bar and world gold reference value in a beautiful, simple view.">
<title>GOLD GLOBE | My Gold · World Gold</title>

<meta property="og:title" content="GOLD GLOBE ✨">
<meta property="og:description" content="Your gold bar. A world of gold.">
<meta property="og:type" content="website">

<style>
:root{
  --gold:#f5ce72;
  --muted:#bcb6a5;
  --apple:#c8f36c;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at 50% -15%,#4d391c 0,#14120f 38%,#08090b 85%);
  color:#fff7e7;
  font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
button,select{font:inherit}
button{cursor:pointer}
main{max-width:980px;margin:auto;padding:19px 14px 40px}
header{text-align:center;margin:8px 0 20px}
h1{
  font-size:22px;
  letter-spacing:.26em;
  margin:0;
  color:var(--gold);
}
header small{
  display:block;
  margin-top:7px;
  letter-spacing:.18em;
  color:var(--muted);
  font-size:10px;
}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{
  min-width:0;
  text-align:center;
  padding:22px 16px;
  background:linear-gradient(160deg,#29241eaa,#101114ee);
  border:1px solid #a7834b55;
  border-radius:25px;
  box-shadow:0 20px 50px #0006;
}
h2{
  font-size:13px;
  color:var(--gold);
  letter-spacing:.17em;
  margin:0 0 15px;
}
.bar-stage{
  height:168px;
  display:grid;
  place-items:center;
  perspective:600px;
}
.goldbar{
  width:235px;
  max-width:85%;
  height:122px;
  border-radius:18px 18px 25px 25px;
  background:linear-gradient(130deg,#fff3b0,#f4c65c 30%,#bc852a 70%,#805518);
  box-shadow:inset 0 3px 7px #fff9d5cc,
    inset -8px -12px 15px #65400780,
    0 17px 25px #0009,
    0 0 55px #d19e2833;
  transform:rotateX(14deg) rotateY(-12deg);
  animation:float 5s ease-in-out infinite;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#624007;
  text-shadow:0 1px #fff6a366;
  border:2px solid #efd181;
}
.goldbar:before{
  content:'FINE GOLD';
  font-size:10px;
  letter-spacing:.25em;
  font-weight:800;
}
.goldbar strong{font-size:30px;margin:7px 0}
.goldbar:after{
  content:'999.9 · 24K';
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
}
@keyframes float{
  50%{transform:translateY(-9px) rotateX(10deg) rotateY(3deg)}
}
.price{
  font-weight:850;
  font-size:clamp(28px,4vw,40px);
  font-variant-numeric:tabular-nums;
  margin:8px 0 4px;
  overflow-wrap:anywhere;
}
.sub{
  font-size:11px;
  color:var(--muted);
  min-height:17px;
}
.controls{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:18px;
  flex-wrap:wrap;
}
.controls select,.weight{
  background:#22211e;
  color:#fff4d7;
  border:1px solid #a68b5a88;
  border-radius:13px;
  padding:12px;
  min-height:44px;
}
.weight{width:120px}
select{min-width:98px}
.globe-stage{
  height:207px;
  display:grid;
  place-items:center;
  position:relative;
}
.globe{
  width:193px;
  height:193px;
  border-radius:50%;
  position:relative;
  overflow:hidden;
  box-shadow:inset -22px -18px 35px #0e0c0a,
    inset 8px 8px 22px #fff1a23d,
    0 0 40px #d9a12c44;
  background:radial-gradient(circle at 29% 22%,#f5da91,#ae7a29 50%,#483314 94%);
}
.globe svg{
  width:100%;
  height:100%;
  opacity:.58;
  animation:glowspin 26s ease-in-out infinite alternate;
}
.globe path{
  fill:#563f20;
  stroke:#efd18b55;
  stroke-width:1;
}
@keyframes glowspin{
  to{transform:translateX(-9%) scale(1.12)}
}
.country-grid{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}
.flag{
  background:#25221d;
  border:1px solid #5e5036;
  color:white;
  border-radius:13px;
  font-size:22px;
  min-width:51px;
  min-height:45px;
}
.flag[aria-pressed=true]{
  border-color:#e9c370;
  background:#534024;
  box-shadow:0 0 0 2px #e3bb5844;
}
.who{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.buttons{
  display:flex;
  gap:10px;
  margin:16px auto 0;
  max-width:640px;
}
.action{
  background:var(--apple);
  color:#17240a;
  border:0;
  border-radius:16px;
  flex:1;
  font-size:15px;
  font-weight:850;
  min-height:54px;
  box-shadow:0 5px 20px #a9e45e33;
}
.action:active{transform:scale(.98)}
.status{
  margin:12px auto 0;
  font-size:11px;
  color:#c9c0a8;
  text-align:center;
  line-height:1.8;
  max-width:650px;
}
.status a{color:#dccc8d}
#tip{
  display:none;
  background:#1e2616;
  border:1px solid #a4c77877;
  border-radius:14px;
  padding:12px;
  margin:13px auto 0;
  max-width:600px;
  font-size:13px;
  text-align:center;
  line-height:1.7;
}
#tip.show{display:block}
@media(max-width:650px){
  main{padding:16px 12px 35px}
  .layout{grid-template-columns:1fr}
  .panel{padding:19px 12px}
  .bar-stage{height:156px}
  .globe-stage{height:195px}
  h1{font-size:20px}
  .price{font-size:34px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style>
</head>
<body>
<main>

<header>
  <h1>GOLD GLOBE</h1>
  <small>MY GOLD · WORLD GOLD</small>
</header>

<div class="layout">

<section class="panel" aria-label="My gold bar">
  <h2>✦ MY GOLD</h2>
  <div class="bar-stage">
    <div class="goldbar">
      <strong id="engrave">10 g</strong>
    </div>
  </div>
  <div class="price" id="myPrice">—</div>
  <div class="sub" id="myUnit">24K · MARKET REFERENCE</div>
  <div class="controls">
    <select id="weight" aria-label="Gold weight">
      <option value="1">1 g</option>
      <option value="5">5 g</option>
      <option value="10" selected>10 g</option>
      <option value="20">20 g</option>
      <option value="50">50 g</option>
      <option value="100">100 g</option>
      <option value="250">250 g</option>
      <option value="500">500 g</option>
      <option value="1000">1 kg</option>
    </select>
    <select id="currency" aria-label="Currency">
      <option>SAR</option>
      <option>USD</option>
      <option>EUR</option>
      <option>INR</option>
      <option>CNY</option>
      <option>AED</option>
      <option>GBP</option>
      <option>TRY</option>
      <option>EGP</option>
    </select>
  </div>
</section>

<section class="panel" aria-label="World gold">
  <h2>✦ WORLD GOLD</h2>
  <div class="globe-stage">
    <div class="globe">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path d="M9 49l27-14 21 8 12 21-8 14-16 5-1 16-15 11-12-20-9-13zm44 67 26-8 12 17-6 30-20 27-11-16 4-21zM97 36l28-8 21 11 30-5 17 24-22 13-16-9-9 21-18 9-9-18-24-6-10-15zm18 63 28-4 17 17-8 34-21 20-18-17-7-25zm56 49 23-5 12 17-17 17-20-11z"/>
      </svg>
    </div>
  </div>
  <div class="price" id="worldPrice">—</div>
  <div class="sub">24K · 1 g · <span id="worldCurrency">SAR</span></div>
  <div class="country-grid" id="countries"></div>
  <div class="who" id="countryName">🇸🇦 Saudi Arabia</div>
</section>

</div>

<div class="buttons">
  <button class="action" id="save">🍏 Save</button>
  <button class="action" id="share">↗ Share</button>
</div>

<div id="tip" role="status"></div>

<p class="status" id="status">
  Connecting to gold and currency sources…
</p>

<p class="status">
  Reference metal value only · not a retail buying/selling quote.
  <br>
  Gold:
  <a href="https://gold-api.com/" target="_blank" rel="noopener">Gold API</a>
  · FX:
  <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>
</p>

</main>

<script>
const $=id=>document.getElementById(id),OZ=31.1034768;

const nations=[
  ['SA','🇸🇦','Saudi Arabia','SAR'],
  ['US','🇺🇸','USA','USD'],
  ['AE','🇦🇪','UAE','AED'],
  ['IN','🇮🇳','India','INR'],
  ['CN','🇨🇳','China','CNY'],
  ['GB','🇬🇧','UK','GBP'],
  ['TR','🇹🇷','Türkiye','TRY'],
  ['EG','🇪🇬','Egypt','EGP'],
  ['DE','🇩🇪','Germany','EUR']
];

let state={weight:'10',currency:'SAR',country:'SA'},
    ounce=null,rates=null,stamp='';

try{
  state={
    ...state,
    ...JSON.parse(localStorage.getItem('gold-globe-v2')||'{}')
  };
}catch{}

if(![...$('weight').options].some(o=>o.value===state.weight))
  state.weight='10';

if(![...$('currency').options].some(o=>o.value===state.currency))
  state.currency='SAR';

if(!nations.some(n=>n[0]===state.country))
  state.country='SA';

$('weight').value=state.weight;
$('currency').value=state.currency;

const savePrefs=()=>{
  try{
    localStorage.setItem('gold-globe-v2',JSON.stringify(state));
  }catch{}
};

const cash=(value,cur)=>
  new Intl.NumberFormat('en-US',{
    style:'currency',
    currency:cur,
    maximumFractionDigits:2
  }).format(value);

const selected=()=>nations.find(n=>n[0]===state.country);

function render(){
  const n=selected();

  $('engrave').textContent=
    Number(state.weight)===1000?'1 kg':state.weight+' g';

  $('worldCurrency').textContent=n[3];
  $('countryName').textContent=n[1]+' '+n[2];

  $('myPrice').textContent=ounce&&rates?.[state.currency]
    ?cash(ounce/OZ*Number(state.weight)*rates[state.currency],state.currency)
    :'—';

  $('worldPrice').textContent=ounce&&rates?.[n[3]]
    ?cash(ounce/OZ*rates[n[3]],n[3])
    :'—';

  $('countries').innerHTML='';

  for(const item of nations){
    const b=document.createElement('button');
    b.className='flag';
    b.textContent=item[1];
    b.title=item[2];
    b.setAttribute('aria-label',item[2]);
    b.setAttribute('aria-pressed',String(item[0]===state.country));

    b.onclick=()=>{
      state.country=item[0];
      savePrefs();
      render();
    };

    $('countries').appendChild(b);
  }
}

$('weight').onchange=e=>{
  state.weight=e.target.value;
  savePrefs();
  render();
};

$('currency').onchange=e=>{
  state.currency=e.target.value;
  savePrefs();
  render();
};

async function load(){
  try{
    const [g,f]=await Promise.all([
      fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'}),
      fetch('https://open.er-api.com/v6/latest/USD')
    ]);

    if(!g.ok||!f.ok)throw Error('response');

    const gold=await g.json(),
          fx=await f.json();

    if(
      !Number.isFinite(Number(gold.price))||
      Number(gold.price)<=0||
      fx.result!=='success'||
      !fx.rates?.USD
    )throw Error('data');

    ounce=Number(gold.price);
    rates=fx.rates;
    stamp=gold.updatedAt||'';

    $('status').textContent=
      'Gold: '+
      (stamp
        ?new Date(stamp).toLocaleString('en-GB',{
          dateStyle:'medium',
          timeStyle:'short',
          timeZone:'UTC'
        })+' UTC'
        :'latest available')+
      ' · FX: '+
      (fx.time_last_update_utc||'latest available')+
      ' · Est. 24K spot value';

    render();
  }catch(e){
    $('status').textContent=
      'Price unavailable · Check connection and refresh. No sample prices are shown.';
    render();
  }
}

$('save').onclick=async()=>{
  savePrefs();

  const tip=$('tip');
  tip.classList.add('show');

  tip.textContent=/iPhone|iPad|iPod/.test(navigator.userAgent)
    ?'✓ Choices saved on this device. To save the page: Safari Share ⬆ → Add to Home Screen.'
    :'✓ Choices saved on this device. Use your browser bookmark ⭐ or Add to Home Screen.';

  try{
    await navigator.clipboard.writeText(location.href);
    tip.textContent+=' Link copied.';
  }catch{}
};

$('share').onclick=async()=>{
  const url=location.href,
        text='✨ GOLD GLOBE · My Gold · World Gold';

  try{
    if(navigator.share){
      await navigator.share({
        title:'GOLD GLOBE',
        text,
        url
      });
      return;
    }
  }catch(e){
    if(e.name==='AbortError')return;
  }

  window.open(
    'https://wa.me/?text='+encodeURIComponent(text+'\n'+url),
    '_blank',
    'noopener'
  );
};

render();
load();
</script>
</body>
</html>

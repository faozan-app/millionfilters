<style>
:root{--gold:#eec775;--ivory:#fff0c7;--muted:#b8a684;--mint:#b8efab;--line:rgba(236,184,83,.28)}
*{box-sizing:border-box}
html{min-height:100%;background:#090908}
body{margin:0;min-height:100vh;color:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#090908;text-align:center}
main{width:min(100%,540px);min-height:100vh;margin:0 auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#080706 0,#120d07 38%,#0c0b09 80%,#080908 100%);box-shadow:0 0 100px #0009}
/* One continuous jewellery composition, not separate cards */
.stage{position:relative;isolation:isolate;padding-bottom:22px;overflow:hidden;background:radial-gradient(ellipse 85% 25% at 50% 54%,#67400e66,transparent 75%)}
.stage:before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:min(178vw,920px);background:url('gold-globe-hero.webp') center top / 100% auto no-repeat;-webkit-mask-image:linear-gradient(#000 0%,#000 73%,transparent 100%);mask-image:linear-gradient(#000 0%,#000 73%,transparent 100%);pointer-events:none}
.hero-space{height:clamp(510px,154vw,805px);max-height:805px;position:relative}
.hero-space:after{content:"";position:absolute;bottom:-2px;left:0;right:0;height:120px;background:linear-gradient(transparent,#100c08);pointer-events:none}
.stage-caption{position:relative;color:#efce89;letter-spacing:.27em;font-size:10px;margin:-15px 0 15px;text-shadow:0 1px 5px #000;z-index:2}
.gold-content{position:relative;z-index:2;margin:0 13px;padding:9px 14px 24px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(160deg,rgba(27,19,11,.86),rgba(10,11,10,.92) 65%);box-shadow:0 13px 40px #0007,inset 0 1px 0 #ffda8c30;backdrop-filter:blur(7px)}
.bar-wrap{position:relative;max-width:445px;margin:0 auto 2px;animation:float-bar 5.8s ease-in-out infinite;filter:drop-shadow(0 12px 19px #000a)}
.bar-wrap img{width:100%;height:auto;display:block}
.engrave{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:47%;color:#73410e;text-shadow:0 1px #ffebae9c,0 -1px #5b310655;display:flex;flex-direction:column;align-items:center;pointer-events:none;white-space:nowrap}
.engrave span:first-child{font:800 clamp(9px,2vw,13px) Georgia,serif;letter-spacing:.1em}
.engrave strong{font:900 clamp(26px,7vw,44px) Georgia,serif;line-height:1.18}
.engrave span:last-child{font-weight:850;font-size:clamp(8px,2vw,11px)}
@keyframes float-bar{0%,100%{transform:translateY(2px) rotate(-.35deg)}50%{transform:translateY(-7px) rotate(.35deg)}}
.label{color:var(--gold);font-size:10px;letter-spacing:.2em;font-weight:800;margin:3px 0 8px}
.price{font-size:clamp(34px,9vw,55px);font-weight:900;line-height:1.14;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;color:#fff2cb;text-shadow:0 0 22px #e8a64625}
.unit{color:#dfc99b;font-size:12px;letter-spacing:.05em;margin-top:9px}
.status{color:#a99d89;font-size:11px;min-height:18px;line-height:1.6;margin-top:9px}
.weights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:20px}
.weights button{font:800 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:46px;border-radius:13px;padding:9px 4px;background:linear-gradient(180deg,#342719,#181612);border:1px solid #cc9c5066;color:#f1d99e;cursor:pointer;touch-action:manipulation}
.weights button.active{background:linear-gradient(#fff0b6,#e6ba58 60%,#b9842e);color:#4d300b;border-color:#ffe5a0;box-shadow:0 3px 13px #d1a04340}
.weights button:focus-visible,.share:focus-visible{outline:3px solid #f6d989;outline-offset:3px}
.share{display:flex;align-items:center;justify-content:center;gap:11px;margin:17px 14px 0;width:calc(100% - 28px);min-height:59px;border:1px solid #e6ffdd;border-radius:18px;background:linear-gradient(130deg,#ddfad4,#b9efae 58%,#98d890);color:#173a24;box-shadow:0 7px 25px #94dc8a35,inset 0 2px 3px #fff8;font-size:17px;font-weight:900;letter-spacing:.05em;cursor:pointer}
.share:active{transform:scale(.99)}
.share svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.contact{margin:25px 20px 0;padding:20px 0 7px;border-top:1px solid var(--line)}
.contact .heading{color:#d7b66d;font-size:10px;letter-spacing:.12em;font-weight:800}
.contact .phone{display:block;color:#f4e1b4;font-size:20px;letter-spacing:.04em;font-weight:700;margin-top:10px;pointer-events:none;user-select:none;-webkit-user-select:none}
footer{padding:13px 18px 37px;color:#a49a87;font-size:10px;line-height:1.9}
@media(max-width:390px){.hero-space{height:147vw}.stage-caption{margin-top:-10px}.weights button{font-size:12px}.gold-content{margin:0 10px;padding:8px 10px 20px}}
@media(min-width:540px){.hero-space{height:810px}}
@media(prefers-reduced-motion:reduce){.bar-wrap{animation:none}}
</style>
</head>
<body>
<main>
<section class="stage" aria-label="GOLD GLOBE luxury gold design and gold prices">
  <div class="hero-space" role="img" aria-label="Golden globe pendant and necklace on black velvet background"></div>
  <div class="stage-caption">✦ WORLD GOLD · 24K ✦</div>
  <div class="gold-content">
    <div class="bar-wrap">
      <img src="gold-bar-clean.webp" width="980" height="460" alt="Animated fine gold bullion bar" onerror="this.onerror=null;this.src='gold-bar-fallback.svg'">
      <div class="engrave" aria-hidden="true"><span>FINE GOLD</span><strong id="barWeight">1 kg</strong><span>999.9 · 24K</span></div>
    </div>
    <div class="label">GLOBAL GOLD PRICE · USD</div>
    <div class="price" id="price" aria-live="polite">—</div>
    <div class="unit" id="unit">USD / 1 kg · 24K</div>
    <div class="status" id="status" aria-live="polite">Loading latest price…</div>
    <div class="weights" id="weights" aria-label="Choose gold weight"></div>
  </div>
  <button class="share" id="share" type="button" aria-label="Share the selected gold reference price">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.7 10.6l6.6-4.2M8.7 13.4l6.6 4.2"/></svg> SHARE GOLD
  </button>
  <div class="contact">
    <div class="heading">CONTACT &amp; ADVERTISING · WHATSAPP</div>
    <span class="phone" translate="no">+966 55 398 9766</span>
  </div>
</section>
<footer>Indicative spot metal value · USD only<br>Not a retail buying or selling quote<br>GOLD GLOBE · Signature visual concept</footer>
</main>
<script>
'use strict';
const OUNCE=31.1034768;
const weights=[['1 kg',1000],['500 g',500],['250 g',250],['100 g',100],['50 g',50],['20 g',20],['10 g',10],['5 g',5],['1 g',1],['Ounce',OUNCE]];
let spot=null,grams=1000,selected='1 kg';
const el=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
for(const [label,g] of weights){
 const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.label=label;
 b.onclick=()=>{selected=label;grams=g;render()};el('weights').appendChild(b);
}
function render(){
 el('barWeight').textContent=selected;
 el('unit').textContent=selected==='Ounce'?'USD / TROY OUNCE · 24K':'USD / '+selected+' · 24K';
 el('price').textContent=spot===null?'—':money(spot*grams/OUNCE);
 el('weights').querySelectorAll('button').forEach(b=>{const active=b.dataset.label===selected;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
}
async function updatePrice(){
 try{
  const r=await fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'});
  if(!r.ok)throw Error('Price request failed');
  const d=await r.json();const p=Number(d.price);
  if(!Number.isFinite(p)||p<=0)throw Error('Invalid gold price');
  spot=p;
  const date=d.updatedAt?new Date(d.updatedAt):null;
  el('status').textContent=date&&!isNaN(date.getTime())?'Updated: '+date.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'UTC'})+' UTC':'Latest available gold price';
 }catch(e){spot=null;el('status').textContent='Price unavailable · Refresh to retry'}
 render();
}
el('share').onclick=async()=>{
 const url='https://millionfilters.com/';
 const msg=spot===null?'✨ GOLD GLOBE\n\nWorld Gold Reference Prices · USD':'✨ GOLD GLOBE\n\n🥇 '+selected+' — '+money(spot*grams/OUNCE)+'\n\nWorld Gold Reference Price · USD';
 try{if(navigator.share){await navigator.share({title:'GOLD GLOBE',text:msg,url});return}}catch(e){if(e.name==='AbortError')return}
 window.open('https://wa.me/?text='+encodeURIComponent(msg+'\n\n'+url),'_blank','noopener');
};
render();updatePrice();
</script>
</body>
</html>

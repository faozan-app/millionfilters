
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eefa">
<meta name="description" content="Send a beautiful smile to someone you love. Free greeting cards with personal messages to share around the world.">
<meta name="robots" content="index,follow">
<title>SEND A SMILE | Share Happiness</title>

<style>
:root{
  --ink:#4a345a;
  --pink:#ef63ab;
  --purple:#9274e5;
  --glass:rgba(255,255,255,.62);
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 12%,#ffd6e9 0%,transparent 38%),
    radial-gradient(circle at 85% 30%,#d9d0ff 0%,transparent 40%),
    radial-gradient(circle at 48% 90%,#c5f5ef 0%,transparent 42%),
    #f8f2ff;
  background-attachment:fixed;
  text-align:center;
}
button{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible,
textarea:focus-visible{
  outline:3px solid #7656c9;
  outline-offset:3px;
}
.container{
  width:min(100% - 28px,510px);
  margin:auto;
  padding:30px 0 45px;
}
.logo{
  width:68px;height:68px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  border-radius:22px;
  font-size:36px;
  background:linear-gradient(135deg,#fff,#ffd4ec);
  box-shadow:0 10px 30px #db91b754,
    inset 0 2px 3px #fff;
}
h1{
  font-size:29px;
  letter-spacing:1px;
  margin:9px 0;
}
.subtitle{
  font-size:14px;
  opacity:.75;
  margin:0 0 25px;
}
.glass{
  background:var(--glass);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 14px 40px rgba(112,73,143,.12),
    inset 0 1px 2px white;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:28px;
}
.panel{
  padding:21px 16px;
  margin-bottom:18px;
}
.section-title{
  font-weight:750;
  font-size:16px;
  margin:0 0 17px;
}
.choices{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.choice{
  min-height:83px;
  border:1px solid #ffffffd9;
  border-radius:19px;
  background:linear-gradient(145deg,#ffffffea,#ffffff75);
  box-shadow:0 5px 13px #b484a71b,
    inset 0 1px 2px white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
  color:#5d4867;
  transition:transform .15s,background .15s;
}
.choice:active{transform:scale(.94)}
.choice.active{
  background:linear-gradient(145deg,#ffe3f2,#e5dbff);
  border:2px solid #d77bc5;
  box-shadow:0 5px 20px #d77bc533;
}
.choice .emoji{
  font-size:31px;
  line-height:1.15;
  filter:drop-shadow(0 4px 5px #95668a25);
}
.choice .name{
  font-size:10px;
  font-weight:650;
}
.preview{
  min-height:315px;
  padding:26px 15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%,#ffffffea,transparent 45%),
    linear-gradient(145deg,#ffe7f3,#e9e1ff 55%,#d7faf4);
}
.preview:before{
  content:"";
  position:absolute;
  width:210px;height:210px;
  border-radius:50%;
  background:#fff7;
  filter:blur(22px);
}
.preview-content{
  position:relative;
  z-index:1;
  width:100%;
}
.big-emoji{
  font-size:86px;
  line-height:1.35;
  filter:drop-shadow(0 12px 10px #95668a25);
  animation:float 3.2s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
.message{
  margin:10px auto;
  font-size:25px;
  font-weight:850;
  max-width:350px;
}
.small-message{
  font-size:14px;
  line-height:1.6;
  opacity:.7;
  max-width:310px;
  margin:auto;
}
.sparkle{
  position:absolute;
  font-size:24px;
  animation:twinkle 2.4s ease-in-out infinite;
  pointer-events:none;
}
.s1{left:12%;top:17%}
.s2{right:13%;top:27%;animation-delay:.6s}
.s3{left:20%;bottom:15%;animation-delay:1.2s}
.s4{right:20%;bottom:16%;animation-delay:1.7s}
@keyframes twinkle{
  0%,100%{opacity:.3;transform:scale(.75)}
  50%{opacity:1;transform:scale(1.2)}
}

/* Optional personal message */
.personal-message{
  margin:19px auto 0;
  max-width:340px;
  padding:12px 14px;
  border-radius:16px;
  background:linear-gradient(140deg,#fffafde6,#ffffff96);
  border:1px solid #fff;
  box-shadow:0 5px 16px #a87a9c1c;
  color:#9b477e;
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  font-weight:600;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  unicode-bidi:plaintext;
}
.personal-entry{
  margin-top:16px;
  padding:14px;
  border:1px solid #fff;
  background:linear-gradient(145deg,#ffffffdc,#fff1f9ad);
  border-radius:19px;
  text-align:left;
  box-shadow:inset 0 1px 2px #fff;
}
.entry-label{
  display:block;
  margin:0 0 8px 3px;
  font-size:12px;
  font-weight:750;
  color:#735586;
}
.personal-entry textarea{
  display:block;
  width:100%;
  min-height:65px;
  max-height:145px;
  resize:vertical;
  padding:13px;
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  color:#583f65;
  background:#ffffffcc;
  border:1px solid #ebd9ed;
  border-radius:13px;
}
.personal-entry textarea::placeholder{
  color:#ae99b4;
}
.entry-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  padding:0 3px;
  font-size:11px;
  color:#9a84a2;
}
.actions{
  display:grid;
  gap:10px;
  margin-top:18px;
}
.btn{
  width:100%;
  border:0;
  border-radius:17px;
  padding:16px 14px;
  font-size:15px;
  font-weight:800;
  min-height:53px;
  box-shadow:0 7px 18px #ae82bf28;
}
.primary{
  color:white;
  background:linear-gradient(110deg,#f164ac,#9676e9);
}
.secondary{
  background:#ffffffc9;
  color:#735586;
  border:1px solid white;
}
.btn:active{transform:scale(.98)}
.hidden{display:none!important}
.footer{
  margin:27px 0 5px;
  font-size:12px;
  opacity:.75;
  line-height:1.9;
}
.contact{
  margin-top:17px;
  padding-top:13px;
  border-top:1px solid #ffffffb5;
  font-size:12px;
  color:#77617f;
}
.contact-number{
  font-size:13px;
  font-weight:700;
  color:#634a70;
  direction:ltr;
  unicode-bidi:isolate;
  user-select:text;
  -webkit-user-select:text;
}
#toast{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:30px;
  color:white;
  background:#604a76;
  box-shadow:0 10px 30px #0002;
  font-size:13px;
  z-index:50;
  max-width:90%;
}
@media(max-width:360px){
  .choices{gap:7px}
  .choice{min-height:73px}
  .choice .emoji{font-size:27px}
  h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="logo">💝</div>
  <h1>SEND A SMILE</h1>
  <p class="subtitle">One Smile. One World. ❤️</p>

  <section id="createScreen">
    <div class="glass panel">
      <h2 class="section-title">Choose a Gift ✨</h2>
      <div class="choices" id="choices"></div>
    </div>

    <div class="glass panel">
      <h2 class="section-title">Your Gift 💝</h2>

      <div class="glass preview">
        <span class="sparkle s1">✨</span>
        <span class="sparkle s2">💫</span>
        <span class="sparkle s3">✨</span>
        <span class="sparkle s4">⭐</span>

        <div class="preview-content">
          <div class="big-emoji" id="previewEmoji">❤️</div>
          <div class="message" id="previewTitle">
            Just For You!
          </div>
          <div class="small-message" id="previewText">
            Someone is thinking of you.
          </div>
          <div class="personal-message hidden"
               id="previewPersonal"></div>
        </div>
      </div>

      <div class="personal-entry">
        <label class="entry-label" for="personalInput">
          ✨ Add Your Own Message (Optional)
        </label>
        <textarea id="personalInput"
          maxlength="160"
          rows="2"
          dir="auto"
          placeholder="Write something special..."></textarea>
        <div class="entry-footer">
          <span>Your words, your gift 💕</span>
          <span id="charCount">0 / 160</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="shareBtn">
          💌 SHARE YOUR GIFT
        </button>
        <button class="btn secondary" id="copyBtn">
          🔗 COPY GIFT LINK
        </button>
      </div>
    </div>
  </section>

  <section id="receivedScreen" class="hidden">
    <div class="glass panel">
      <h2 class="section-title">A Gift For You 💌</h2>

      <div class="glass preview">
        <span class="sparkle s1">✨</span>
        <span class="sparkle s2">💫</span>
        <span class="sparkle s3">✨</span>
        <span class="sparkle s4">⭐</span>

        <div class="preview-content">
          <div class="big-emoji" id="receivedEmoji"></div>
          <div class="message" id="receivedTitle"></div>
          <div class="small-message" id="receivedText"></div>
          <div class="personal-message hidden"
               id="receivedPersonal"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="createOwnBtn">
          💝 SEND A GIFT BACK
        </button>
        <button class="btn secondary" id="receivedShareBtn">
          💌 SHARE THIS GIFT
        </button>
      </div>
    </div>
  </section>

  <footer class="footer">
    Made to Share Happiness 🌍
    <div>© SEND A SMILE</div>
    <div class="contact">
      Contact & Advertising
      <div>
        WhatsApp:
        <span class="contact-number">+ 966553989766</span>
      </div>
    </div>
  </footer>
</main>

<div id="toast" class="hidden" role="status"></div>

<script>
"use strict";

const gifts=[
  {
    emoji:"❤️",
    name:"Love",
    title:"Just For You!",
    text:"Someone is thinking of you."
  },
  {
    emoji:"🍓",
    name:"Strawberry",
    title:"Something Sweet!",
    text:"Sending you a little sweetness today."
  },
  {
    emoji:"🌹",
    name:"Rose",
    title:"A Rose For You!",
    text:"A little beauty for your day."
  },
  {
    emoji:"🎂",
    name:"Birthday",
    title:"Happy Birthday!",
    text:"Wishing you a beautiful day!"
  },
  {
    emoji:"🎉",
    name:"Celebrate",
    title:"Let's Celebrate!",
    text:"Wonderful moments are worth sharing."
  },
  {
    emoji:"💐",
    name:"Flowers",
    title:"Beautiful Wishes!",
    text:"Sending flowers and happiness."
  },
  {
    emoji:"🪎",
    name:"Treasure",
    title:"You're A Treasure!",
    text:"A little treasure for someone special."
  },
  {
    emoji:"💖",
    name:"Heart",
    title:"You Are Special!",
    text:"Never forget how wonderful you are."
  },
  {
    emoji:"🩵",
    name:"Blue Heart",
    title:"With All My Heart!",
    text:"Sending peaceful and loving thoughts."
  },
  {
    emoji:"⭐",
    name:"Star",
    title:"You're A Star!",
    text:"Keep shining in your own way."
  },
  {
    emoji:"🍀",
    name:"Luck",
    title:"Good Luck!",
    text:"Wishing you wonderful things ahead."
  },
  {
    emoji:"💍",
    name:"Ring",
    title:"Forever Special!",
    text:"Some bonds are made to last forever."
  }
];

const $=id=>document.getElementById(id);
let selected=0;
let receivedIndex=null;
let receivedMessage="";
let toastTimer;

function cleanMessage(value){
  return String(value||"").trim().slice(0,160);
}

function ownMessage(){
  return cleanMessage($("personalInput").value);
}

function showToast(message){
  clearTimeout(toastTimer);
  $("toast").textContent=message;
  $("toast").classList.remove("hidden");
  toastTimer=setTimeout(()=>{
    $("toast").classList.add("hidden");
  },2500);
}

function displayPersonal(element,message){
  element.textContent=message;
  element.classList.toggle("hidden",!message);
}

function updatePersonal(){
  const message=ownMessage();
  displayPersonal($("previewPersonal"),message);
  $("charCount").textContent=
    $("personalInput").value.length+" / 160";
}

function buildChoices(){
  const grid=$("choices");
  grid.replaceChildren();

  gifts.forEach((gift,index)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="choice";
    btn.setAttribute("aria-label",gift.name);
    btn.setAttribute("aria-pressed","false");

    const emoji=document.createElement("span");
    emoji.className="emoji";
    emoji.textContent=gift.emoji;

    const name=document.createElement("span");
    name.className="name";
    name.textContent=gift.name;

    btn.append(emoji,name);
    btn.addEventListener("click",()=>choose(index));
    grid.appendChild(btn);
  });
  choose(0);
}

function choose(index){
  selected=index;
  const gift=gifts[index];

  $("previewEmoji").textContent=gift.emoji;
  $("previewTitle").textContent=gift.title;
  $("previewText").textContent=gift.text;

  document.querySelectorAll(".choice")
    .forEach((btn,i)=>{
      btn.classList.toggle("active",i===index);
      btn.setAttribute("aria-pressed",String(i===index));
    });
}

function giftURL(index,message=""){
  const url=new URL(window.location.href);
  url.search="";
  url.hash="";
  url.searchParams.set("gift",String(index+1));

  const personal=cleanMessage(message);
  if(personal){
    url.searchParams.set("msg",personal);
  }
  return url.toString();
}

function giftText(index,message=""){
  const gift=gifts[index];
  const personal=cleanMessage(message);

  return (
    gift.emoji+" "+gift.title+"\n"+
    gift.text+
    (personal?"\n\n💌 "+personal:"")+
    "\n\nOpen your gift 💝\n"+
    giftURL(index,personal)
  );
}

async function shareGift(index,message=""){
  const gift=gifts[index];
  const personal=cleanMessage(message);
  const url=giftURL(index,personal);

  if(navigator.share){
    try{
      await navigator.share({
        title:"SEND A SMILE",
        text:gift.emoji+" "+gift.title+
          "\n"+gift.text+
          (personal?"\n💌 "+personal:""),
        url:url
      });
      return;
    }catch(error){
      if(error.name==="AbortError")return;
    }
  }

  await copyText(giftText(index,personal));
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Gift link copied! 💝");
  }catch(error){
    const field=document.createElement("textarea");
    field.value=text;
    field.style.position="fixed";
    field.style.opacity="0";
    field.setAttribute("readonly","");
    document.body.appendChild(field);
    field.select();

    let success=false;
    try{
      success=document.execCommand("copy");
    }catch(e){}
    field.remove();

    if(success){
      showToast("Gift link copied! 💝");
    }else{
      showToast("Please use the Share button.");
    }
  }
}

function openReceived(index,message=""){
  const gift=gifts[index];
  receivedIndex=index;
  receivedMessage=cleanMessage(message);

  $("receivedEmoji").textContent=gift.emoji;
  $("receivedTitle").textContent=gift.title;
  $("receivedText").textContent=gift.text;

  displayPersonal(
    $("receivedPersonal"),
    receivedMessage
  );

  $("createScreen").classList.add("hidden");
  $("receivedScreen").classList.remove("hidden");
  window.scrollTo(0,0);
}

function openCreate(){
  receivedIndex=null;
  receivedMessage="";

  $("receivedScreen").classList.add("hidden");
  $("createScreen").classList.remove("hidden");

  const url=new URL(window.location.href);
  url.searchParams.delete("gift");
  url.searchParams.delete("msg");
  url.hash="";
  history.replaceState(null,"",url.toString());

  window.scrollTo(0,0);
}

function initialize(){
  buildChoices();

  $("personalInput").addEventListener(
    "input",updatePersonal
  );

  $("shareBtn").addEventListener("click",()=>{
    shareGift(selected,ownMessage());
  });

  $("copyBtn").addEventListener("click",()=>{
    copyText(giftURL(selected,ownMessage()));
  });

  $("createOwnBtn").addEventListener("click",()=>{
    openCreate();
  });

  $("receivedShareBtn").addEventListener("click",()=>{
    if(receivedIndex!==null){
      shareGift(receivedIndex,receivedMessage);
    }
  });

  const params=new URLSearchParams(
    window.location.search
  );
  const raw=params.get("gift");

  if(raw!==null && /^[1-9][0-9]*$/.test(raw)){
    const index=Number(raw)-1;
    if(Number.isSafeInteger(index) &&
       index>=0 &&
       index<gifts.length){
      openReceived(
        index,
        cleanMessage(params.get("msg"))
      );
    }
  }
}

initialize();
</script>
</body>
</html>

function createGiftSVG(type){const map={love:heartSVG,strawberry:strawberrySVG,rose:roseSVG,birthday:birthdaySVG,celebrate:celebrateSVG,flowers:flowersSVG,treasure:treasureSVG,heart:pinkHeartSVG,blueheart:blueHeartSVG,star:starSVG,luck:luckSVG,ring:ringSVG};return map[type]();}
function createPhoneSVG(number){return svgData(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#ffe7f4"/><stop offset="100%" stop-color="#f0e7ff"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef63ab"/><stop offset="100%" stop-color="#9274e5"/></linearGradient><filter id="shadow" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8f6d9b" flood-opacity=".16"/></filter></defs>
<rect x="10" y="10" rx="28" ry="28" width="500" height="90" fill="url(#g)" stroke="rgba(255,255,255,.9)" filter="url(#shadow)"/>
<circle cx="62" cy="55" r="22" fill="#25D366"/><path d="M54 45 C54 56 64 66 75 66 L79 73 L70 72 C58 72 48 62 48 50 C48 43 53 37 60 37 L67 44 C65 46 63 48 62 49 C60 48 58 46 56 44 Z" fill="#fff" opacity=".95"/>
<text x="100" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="29" font-weight="700" fill="url(#line)" letter-spacing=".5">${number}</text></svg>`);}

const gifts=[
{type:"love",name:"Love",title:"Just For You!",text:"Someone is thinking of you."},
{type:"strawberry",name:"Strawberry",title:"Something Sweet!",text:"Sending you a little sweetness today."},
{type:"rose",name:"Rose",title:"A Rose For You!",text:"A little beauty for your day."},
{type:"birthday",name:"Birthday",title:"Happy Birthday!",text:"Wishing you a beautiful day!"},
{type:"celebrate",name:"Celebrate",title:"Let's Celebrate!",text:"Wonderful moments are worth sharing."},
{type:"flowers",name:"Flowers",title:"Beautiful Wishes!",text:"Sending flowers and happiness."},
{type:"treasure",name:"Treasure",title:"You're A Treasure!",text:"A little treasure for someone special."},
{type:"heart",name:"Heart",title:"You Are Special!",text:"Never forget how wonderful you are."},
{type:"blueheart",name:"Blue Heart",title:"With All My Heart!",text:"Sending peaceful and loving thoughts."},
{type:"star",name:"Star",title:"You're A Star!",text:"Keep shining in your own way."},
{type:"luck",name:"Luck",title:"Good Luck!",text:"Wishing you wonderful things ahead."},
{type:"ring",name:"Ring",title:"Forever Special!",text:"Some bonds are made to last forever."}
];
const $=id=>document.getElementById(id);
let selected=0;
let receivedIndex=null;
let receivedMessage="";
let toastTimer;
function cleanMessage(value){return String(value||"").trim().slice(0,160);}
function ownMessage(){return cleanMessage($("personalInput").value);}
function showToast(message){clearTimeout(toastTimer);$("toast").textContent=message;$("toast").classList.remove("hidden");toastTimer=setTimeout(()=>{$("toast").classList.add("hidden");},2500);}
function displayPersonal(element,message){element.textContent=message;element.classList.toggle("hidden",!message);}
function updatePersonal(){const message=ownMessage();displayPersonal($("previewPersonal"),message);$("charCount").textContent=$("personalInput").value.length+" / 160";}
function renderGiftVisual(imgElement,gift){imgElement.src=createGiftSVG(gift.type);imgElement.alt=gift.name;}
function buildChoices(){const grid=$("choices");grid.replaceChildren();gifts.forEach((gift,index)=>{const btn=document.createElement("button");btn.type="button";btn.className="choice";btn.setAttribute("aria-label",gift.name);btn.setAttribute("aria-pressed","false");const image=document.createElement("img");image.className="gift-icon";image.alt=gift.name;image.src=createGiftSVG(gift.type);const name=document.createElement("span");name.className="name";name.textContent=gift.name;btn.append(image,name);btn.addEventListener("click",()=>choose(index));grid.appendChild(btn);});choose(0);}
function choose(index){selected=index;const gift=gifts[index];renderGiftVisual($("previewImage"),gift);$("previewTitle").textContent=gift.title;$("previewText").textContent=gift.text;document.querySelectorAll(".choice").forEach((btn,i)=>{btn.classList.toggle("active",i===index);btn.setAttribute("aria-pressed",String(i===index));});}
function giftURL(index,message=""){const url=new URL(window.location.href);url.pathname="/";url.search="";url.hash="";url.searchParams.set("gift",String(index+1));const personal=cleanMessage(message);if(personal)url.searchParams.set("msg",personal);return url.toString();}
function giftText(index,message=""){const personal=cleanMessage(message);return "\u{1F48C} Just For You!\n\n"+"Someone is thinking of you. \u{2764}\u{FE0F}\n"+"A little surprise is waiting for you.\n"+(personal?"\n\u{1F497} "+personal+"\n":"")+"\n\u{1F381} Open your gift:\n"+giftURL(index,personal);}
// These events measure interactions, not confirmed completion of a message delivery.
function trackGiftEvent(eventName,index){if(typeof window.gtag==="function")window.gtag("event",eventName,{gift_type:gifts[index]?.type||"unknown",gift_number:index+1});}
async function shareGift(index,message=""){
 const personal=cleanMessage(message);const shareMessage=giftText(index,personal);
 if(navigator.share){try{await navigator.share({text:shareMessage});trackGiftEvent("gift_share_completed",index);return;}catch(error){if(error.name==="AbortError")return;}}
 const copied=await copyText(shareMessage);if(copied)trackGiftEvent("gift_share_text_copied",index);
}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast("Copied successfully! \u{1F49D}");return true;}catch(error){const field=document.createElement("textarea");field.value=text;field.style.position="fixed";field.style.opacity="0";field.setAttribute("readonly","");document.body.appendChild(field);field.select();let success=false;try{success=document.execCommand("copy");}catch(e){}field.remove();if(success){showToast("Copied successfully! \u{1F49D}");return true;}else{showToast("Please use the Share button.");return false;}}}
function openReceived(index,message=""){const gift=gifts[index];receivedIndex=index;receivedMessage=cleanMessage(message);renderGiftVisual($("receivedImage"),gift);$("receivedTitle").textContent=gift.title;$("receivedText").textContent=gift.text;displayPersonal($("receivedPersonal"),receivedMessage);$("createScreen").classList.add("hidden");$("receivedScreen").classList.remove("hidden");window.scrollTo(0,0);}
function openCreate(){receivedIndex=null;receivedMessage="";$("receivedScreen").classList.add("hidden");$("createScreen").classList.remove("hidden");const url=new URL(window.location.href);url.searchParams.delete("gift");url.searchParams.delete("msg");url.hash="";history.replaceState(null,"",url.toString());window.scrollTo(0,0);}
function initialize(){buildChoices();$("waImage").src=createPhoneSVG(WHATSAPP_NUMBER);$("waImage").alt="WhatsApp "+WHATSAPP_NUMBER;$("personalInput").addEventListener("input",updatePersonal);
 $("shareBtn").addEventListener("click",()=>{trackGiftEvent("gift_share_clicked",selected);shareGift(selected,ownMessage());});
 $("copyBtn").addEventListener("click",async()=>{const copied=await copyText(giftURL(selected,ownMessage()));if(copied)trackGiftEvent("gift_link_copied",selected);});
 $("createOwnBtn").addEventListener("click",()=>{if(receivedIndex!==null)trackGiftEvent("gift_back_clicked",receivedIndex);openCreate();});
 $("receivedShareBtn").addEventListener("click",()=>{if(receivedIndex!==null){trackGiftEvent("received_gift_share_clicked",receivedIndex);shareGift(receivedIndex,receivedMessage);}});
 const params=new URLSearchParams(window.location.search);const raw=params.get("gift");if(raw!==null&&/^[1-9][0-9]*$/.test(raw)){const index=Number(raw)-1;if(Number.isSafeInteger(index)&&index>=0&&index<gifts.length){openReceived(index,cleanMessage(params.get("msg")));trackGiftEvent("gift_received_opened",index);}}
}
initialize();
</script>
</body>
</html>

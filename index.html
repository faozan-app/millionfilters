
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10110f">

<title>GOLD GLOBE | World Gold</title>
<meta name="description" content="GOLD GLOBE — Live world gold spot reference prices in USD. Explore gold values from 1 gram to 1 kilogram.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://millionfilters.com/">

<!-- Luxury social sharing preview -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GOLD GLOBE">
<meta property="og:title" content="GOLD GLOBE | World Gold">
<meta property="og:description" content="Discover world gold prices in USD. A luxurious gold experience.">
<meta property="og:url" content="https://millionfilters.com/">
<meta property="og:image" content="https://millionfilters.com/gold-bar-clean.webp">
<meta property="og:image:alt" content="Luxury fine gold bullion bar">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GOLD GLOBE | World Gold">
<meta name="twitter:description" content="World gold spot reference prices in USD.">
<meta name="twitter:image" content="https://millionfilters.com/gold-bar-clean.webp">

<style>
:root{
 --gold:#f5dfa6;
 --gold-deep:#c89b46;
 --cream:#fff2d1;
 --apple:#b6edaa;
 --apple-dark:#173c24;
 --line:rgba(237,197,113,.25);
}
*{box-sizing:border-box}
html{min-height:100%}
body{
 margin:0;
 min-height:100vh;
 background:
  radial-gradient(ellipse at 50% -7%,#67502b 0%,#302719 22%,transparent 54%),
  radial-gradient(ellipse at 100% 75%,#28302844,transparent 45%),
  linear-gradient(180deg,#151612,#090c0c 75%,#080a09);
 color:#fff3da;
 text-align:center;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
main{
 width:min(100%,520px);
 margin:auto;
 padding:24px 14px 42px;
}
h1{
 margin:8px 0 6px;
 color:var(--gold);
 font-family:Georgia,serif;
 font-size:clamp(25px,6.4vw,34px);
 letter-spacing:.14em;
 text-shadow:0 3px 23px #ddb76155;
}
.tag{
 color:#d2c5aa;
 font-size:11px;
 letter-spacing:.30em;
 margin-bottom:19px;
}
.panel{
 position:relative;
 overflow:hidden;
 border:1px solid var(--line);
 border-radius:30px;
 padding:18px 14px;
 background:
  radial-gradient(ellipse at 50% 8%,#936b3150,transparent 52%),
  linear-gradient(155deg,#30271b,#171914 58%,#101310);
 box-shadow:
  0 20px 50px #0009,
  inset 0 1px 0 #f7dfa421;
}
.eyebrow{
 color:#f4d99b;
 font-size:11px;
 letter-spacing:.21em;
 margin-bottom:12px;
}
.bar-stage{
 position:relative;
 width:min(100%,440px);
 margin:0 auto 3px;
 filter:drop-shadow(0 15px 22px #0009);
 animation:bar-float 6s ease-in-out infinite;
 transform-origin:50% 55%;
}
.bar-stage img{
 display:block;
 width:100%;
 height:auto;
}
.bar-engrave{
 position:absolute;
 top:46%;
 left:50%;
 transform:translate(-50%,-50%);
 width:45%;
 pointer-events:none;
 display:flex;
 flex-direction:column;
 align-items:center;
 color:#6c3c09;
 text-shadow:
  0 1px 1px #fff3bb99,
  0 -1px 1px #8a520f75;
}
.bar-engrave .fine{
 font-family:Georgia,serif;
 font-size:clamp(9px,2.2vw,13px);
 font-weight:800;
 letter-spacing:.11em;
 white-space:nowrap;
}
.bar-engrave .weight{
 font-family:Georgia,serif;
 font-size:clamp(28px,8vw,44px);
 line-height:1.13;
 font-weight:900;
 white-space:nowrap;
}
.bar-engrave .purity{
 font-size:clamp(8px,2.1vw,11px);
 font-weight:850;
 letter-spacing:.07em;
 white-space:nowrap;
}
@keyframes bar-float{
 0%,100%{transform:translateY(1px) rotate(-.55deg)}
 50%{transform:translateY(-9px) rotate(.55deg)}
}
.price-caption{
 color:var(--gold);
 font-size:11px;
 letter-spacing:.20em;
 margin-top:0;
}
.price{
 color:var(--cream);
 font-size:clamp(35px,9vw,53px);
 font-weight:900;
 line-height:1.15;
 margin:10px 0 7px;
 font-variant-numeric:tabular-nums;
 overflow-wrap:anywhere;
 text-shadow:0 2px 25px #d8af6040;
}
.unit{
 color:#decfb0;
 font-size:12px;
}
.status{
 color:#bdb5a2;
 font-size:11px;
 margin:12px 0 0;
 line-height:1.7;
}
.weights{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:9px;
 margin:20px 0 8px;
}
.weights button{
 min-height:47px;
 padding:9px 5px;
 border-radius:13px;
 border:1px solid #d8b67566;
 background:linear-gradient(#373126,#1a1d18);
 color:#f8e4ba;
 font-family:inherit;
 cursor:pointer;
 font-size:13px;
 font-weight:800;
 transition:background .2s,transform .2s;
}
.weights button.active{
 background:linear-gradient(#fff2be,#e8c879 55%,#ca9b43);
 color:#4c350f;
 border-color:#ffecb5;
 box-shadow:0 4px 18px #d6ac5140;
}
.weights button:active{transform:scale(.97)}
.weights button:focus-visible,
.share:focus-visible{
 outline:3px solid #fff1b5;
 outline-offset:3px;
}
.scene{
 position:relative;
 margin:2px -14px -18px;
 height:255px;
 overflow:hidden;
 isolation:isolate;
 background:radial-gradient(ellipse at 50% 82%,#bd8f3529,transparent 58%);
}
.mountains{
 position:absolute;
 left:0;
 bottom:0;
 width:100%;
 height:auto;
 display:block;
 z-index:1;
 filter:drop-shadow(0 0 15px #dc9b2720);
}
.earth-glow{
 position:absolute;
 bottom:8px;
 left:50%;
 transform:translateX(-50%);
 width:220px;
 height:72px;
 background:radial-gradient(ellipse,#ffcf6b88,transparent 72%);
 filter:blur(15px);
 z-index:2;
}
.earth{
 position:absolute;
 left:50%;
 bottom:17px;
 transform:translateX(-50%);
 width:190px;
 height:190px;
 object-fit:contain;
 clip-path:circle(49% at 50% 50%);
 z-index:3;
 filter:
  drop-shadow(0 0 14px #daa64b88)
  drop-shadow(0 7px 17px #0009);
}
.scene:after{
 content:"";
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 height:26px;
 background:linear-gradient(transparent,#11130fbb);
 pointer-events:none;
 z-index:4;
}

/* Fresh luxury green share button */
.share{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:12px;
 width:100%;
 min-height:61px;
 margin-top:20px;
 border:1px solid #e3ffdc;
 border-radius:19px;
 background:linear-gradient(135deg,#d5f8ca,#b4eba8 55%,#94d88d);
 color:var(--apple-dark);
 font-family:inherit;
 font-size:18px;
 font-weight:900;
 letter-spacing:.04em;
 cursor:pointer;
 box-shadow:
  0 9px 28px #86d58a38,
  inset 0 2px 3px #ffffff88;
 transition:transform .2s,filter .2s;
}
.share:active{
 transform:scale(.98);
 filter:brightness(.98);
}
.share svg{
 width:23px;
 height:23px;
 stroke:currentColor;
 fill:none;
 stroke-width:2.2;
 stroke-linecap:round;
 stroke-linejoin:round;
}

/* Elegant non-clickable contact area */
.contact{
 margin-top:25px;
 padding:19px 14px 17px;
 border-top:1px solid var(--line);
 text-align:center;
}
.contact-label{
 color:#d8bd83;
 font-size:11px;
 letter-spacing:.08em;
 font-weight:700;
}
.contact-number{
 margin-top:10px;
 color:#fff0cc;
 font-size:clamp(19px,5vw,23px);
 font-weight:750;
 letter-spacing:.025em;
 font-variant-numeric:tabular-nums;
 user-select:none;
 -webkit-user-select:none;
 pointer-events:none;
}
.contact-note{
 color:#a9a89d;
 font-size:10px;
 margin-top:7px;
}
footer{
 margin-top:12px;
 color:#aaa18e;
 font-size:10px;
 line-height:1.9;
}
@media(max-width:430px){
 .scene{height:225px}
 .earth{width:169px;height:169px}
 .weights button{font-size:12px}
 .bar-stage{width:100%}
}
@media(prefers-reduced-motion:reduce){
 .bar-stage{animation:none}
}
</style>
</head>

<body>
<main>

<h1>GOLD GLOBE</h1>
<div class="tag">WORLD GOLD</div>

<section class="panel">
 <div class="eyebrow">✦ LUXURY GOLD VIEW ✦</div>

 <div class="bar-stage">
  <img src="gold-bar-clean.webp"
       alt="Fine gold bullion bar"
       width="980" height="460">

  <div class="bar-engrave" aria-hidden="true">
   <span class="fine">FINE GOLD</span>
   <strong class="weight" id="barWeight">1 kg</strong>
   <span class="purity">999.9 · 24K</span>
  </div>
 </div>

 <div class="price-caption">GLOBAL GOLD PRICE</div>
 <div class="price" id="price" aria-live="polite">—</div>
 <div class="unit" id="unit">USD / 1 kg · 24K</div>
 <div class="status" id="status">Loading latest price…</div>

 <div class="weights" id="weights"
      aria-label="Choose gold weight"></div>

 <div class="scene" aria-label="Golden Earth and mountains">
  <img src="mountains-soft.webp"
       class="mountains"
       alt="Golden mountain landscape">

  <div class="earth-glow"></div>

  <video class="earth"
         autoplay muted loop playsinline
         webkit-playsinline preload="auto"
         aria-label="Golden Earth rotating smoothly"
         width="320" height="320">
   <source src="earth-spin.mp4" type="video/mp4">
  </video>
 </div>
</section>

<button class="share" id="share" type="button">
 <svg viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="18" cy="5" r="3"/>
  <circle cx="6" cy="12" r="3"/>
  <circle cx="18" cy="19" r="3"/>
  <path d="M8.7 10.6l6.6-4.2M8.7 13.4l6.6 4.2"/>
 </svg>
 SHARE GOLD
</button>

<div class="contact">
 <div class="contact-label">
  CONTACT & ADVERTISING · WHATSAPP
 </div>
 <div class="contact-number" translate="no">
  +966 55 398 9766
 </div>
 <div class="contact-note">
  Contact number only
 </div>
</div>

<footer>
 Indicative spot metal value · USD only
 <br>
 Not a retail buying or selling quote
</footer>

</main>

<script>
'use strict';

const OUNCE=31.1034768;

const weights=[
 ['1 kg',1000],
 ['500 g',500],
 ['250 g',250],
 ['100 g',100],
 ['50 g',50],
 ['20 g',20],
 ['10 g',10],
 ['5 g',5],
 ['1 g',1],
 ['Ounce',OUNCE]
];

let spot=null;
let grams=1000;
let selected='1 kg';

const el=id=>document.getElementById(id);

const money=n=>new Intl.NumberFormat('en-US',{
 style:'currency',
 currency:'USD',
 minimumFractionDigits:2,
 maximumFractionDigits:2
}).format(n);

for(const [label,g] of weights){
 const b=document.createElement('button');
 b.type='button';
 b.textContent=label;
 b.dataset.label=label;
 b.onclick=()=>{
  selected=label;
  grams=g;
  render();
 };
 el('weights').appendChild(b);
}

function render(){
 el('barWeight').textContent=selected;

 el('unit').textContent=selected==='Ounce'
  ?'USD / TROY OUNCE · 24K'
  :'USD / '+selected+' · 24K';

 el('price').textContent=spot===null
  ?'—'
  :money(spot*grams/OUNCE);

 el('weights').querySelectorAll('button').forEach(b=>{
  const a=b.dataset.label===selected;
  b.classList.toggle('active',a);
  b.setAttribute('aria-pressed',String(a));
 });
}

async function updatePrice(){
 try{
  const r=await fetch(
   'https://api.gold-api.com/price/XAU',
   {cache:'no-store'}
  );

  if(!r.ok)throw Error('HTTP');

  const d=await r.json();
  const p=Number(d.price);

  if(!Number.isFinite(p)||p<=0)
   throw Error('Invalid price');

  spot=p;

  const date=d.updatedAt
   ?new Date(d.updatedAt)
   :null;

  el('status').textContent=
   date&&!isNaN(date.getTime())
   ?'Updated: '+date.toLocaleString('en-GB',{
     dateStyle:'medium',
     timeStyle:'short',
     timeZone:'UTC'
    })+' UTC'
   :'Latest available gold price';

 }catch(e){
  spot=null;
  el('status').textContent=
   'Price unavailable · Refresh to retry';
 }

 render();
}

/* Elegant sharing message */
el('share').onclick=async()=>{
 const url='https://millionfilters.com/';

 const msg=spot===null
  ?'✨ GOLD GLOBE\n\nWorld Gold Prices · USD'
  :'✨ GOLD GLOBE\n\n'+
    '🥇 '+selected+' — '+money(spot*grams/OUNCE)+
    '\n\nWorld Gold Price · USD';

 try{
  if(navigator.share){
   await navigator.share({
    title:'GOLD GLOBE',
    text:msg,
    url:url
   });
   return;
  }
 }catch(e){
  if(e.name==='AbortError')return;
 }

 const shareText=msg+'\n\n'+url;
 window.open(
  'https://wa.me/?text='+encodeURIComponent(shareText),
  '_blank',
  'noopener'
 );
};

render();
updatePrice();

// Use source update time, not device clock.
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="GOLD GLOBE — Luxurious world gold page with live USD gold price by weight.">
<title>GOLD GLOBE | Luxury World Gold</title>

<style>
:root{
  --bg:#070707;
  --panel:#121212;
  --panel2:#1a1712;
  --gold1:#fff4bf;
  --gold2:#f2cb69;
  --gold3:#cf9530;
  --gold4:#875611;
  --goldText:#f4d98d;
  --muted:#bfb29a;
  --apple:#c8f36c;
  --shadow:0 18px 45px rgba(0,0,0,.45);
  --line:rgba(255,220,140,.18);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:#fffaf0;
  text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(204,145,34,.22), transparent 28%),
    radial-gradient(circle at 80% 20%, rgba(255,214,122,.10), transparent 20%),
    linear-gradient(180deg,#1a130a 0%, #0c0b09 32%, #070707 100%);
  overflow-x:hidden;
}

main{
  width:min(100%, 520px);
  margin:auto;
  padding:22px 14px 42px;
}

.topGlow{
  position:fixed;
  inset:auto 50% auto 50%;
  width:420px;
  height:180px;
  transform:translateX(-50%);
  top:-60px;
  background:radial-gradient(circle, rgba(245,203,105,.25), transparent 70%);
  pointer-events:none;
  filter:blur(20px);
  z-index:0;
}

h1{
  margin:10px 0 6px;
  color:var(--goldText);
  font-size:24px;
  letter-spacing:.34em;
  font-weight:900;
  position:relative;
  z-index:1;
}

.tag{
  color:#d3c3a1;
  font-size:11px;
  letter-spacing:.30em;
  margin-bottom:16px;
  position:relative;
  z-index:1;
}

.panel{
  position:relative;
  overflow:hidden;
  padding:22px 16px 26px;
  border-radius:30px;
  border:1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)),
    linear-gradient(160deg, rgba(47,38,22,.92), rgba(12,12,12,.96));
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}

.panel:before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  top:-90px;
  left:-70px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(245,203,105,.18), transparent 70%);
  filter:blur(8px);
  pointer-events:none;
}

.panel:after{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  bottom:-110px;
  right:-80px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(245,203,105,.10), transparent 72%);
  filter:blur(10px);
  pointer-events:none;
}

.eyebrow{
  color:var(--goldText);
  font-size:11px;
  letter-spacing:.24em;
  margin-bottom:12px;
  position:relative;
  z-index:1;
}

/* GOLD BAR */
.barWrap{
  position:relative;
  z-index:2;
  margin-top:4px;
}

.goldbar{
  width:245px;
  max-width:88%;
  height:126px;
  margin:0 auto 16px;
  border-radius:20px 20px 28px 28px;
  border:2px solid rgba(255,236,177,.78);
  background:
    linear-gradient(145deg,
      var(--gold1) 0%,
      #ffe897 16%,
      var(--gold2) 34%,
      var(--gold3) 66%,
      var(--gold4) 100%);
  box-shadow:
    inset 0 4px 14px rgba(255,248,210,.92),
    inset -13px -16px 18px rgba(100,63,8,.45),
    0 18px 28px rgba(0,0,0,.45),
    0 0 50px rgba(230,174,52,.22);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#67430b;
  text-shadow:0 1px 0 rgba(255,245,203,.7);
  transform-style:preserve-3d;
  animation:barFloat 6s ease-in-out infinite;
  position:relative;
}

.goldbar:before{
  content:"";
  position:absolute;
  inset:10px 15px;
  border-radius:16px;
  border:1px solid rgba(114,74,12,.28);
}

.goldbar small{
  font-size:10px;
  letter-spacing:.24em;
  font-weight:800;
}

.goldbar strong{
  font-size:33px;
  margin:8px 0;
  letter-spacing:.02em;
}

@keyframes barFloat{
  0%,100%{transform:translateY(0) rotateX(9deg) rotateY(-10deg)}
  50%{transform:translateY(-9px) rotateX(6deg) rotateY(8deg)}
}

/* PRICE UNDER BAR */
.priceCaption{
  color:#e6c478;
  font-size:11px;
  letter-spacing:.22em;
  margin-top:2px;
  position:relative;
  z-index:2;
}

.price{
  margin:12px 0 8px;
  font-size:clamp(36px,9.8vw,54px);
  line-height:1;
  font-weight:900;
  color:#fff4cf;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
  text-shadow:0 0 18px rgba(231,191,88,.08);
  position:relative;
  z-index:2;
}

.unit{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.04em;
  position:relative;
  z-index:2;
}

.status{
  color:#a99f8b;
  font-size:11px;
  line-height:1.7;
  margin:12px 0 0;
  position:relative;
  z-index:2;
}

/* WEIGHTS */
.weights{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:22px 0 24px;
  position:relative;
  z-index:2;
}

.weights button{
  min-height:48px;
  padding:10px 4px;
  border-radius:13px;
  border:1px solid rgba(193,149,63,.38);
  background:linear-gradient(180deg, rgba(40,33,25,.96), rgba(23,19,15,.96));
  color:#f3dbad;
  font-size:13px;
  font-weight:850;
  letter-spacing:.01em;
  cursor:pointer;
  transition:.18s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

.weights button:active{transform:scale(.98)}

.weights button.active{
  background:linear-gradient(180deg,#fff0b7 0%, #e8bb56 52%, #c28a2d 100%);
  color:#54370a;
  border-color:#ffe9a7;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    0 6px 18px rgba(218,163,49,.26);
}

/* GLOBE */
.globeArea{
  position:relative;
  z-index:2;
  margin:8px auto 10px;
  display:grid;
  place-items:center;
}

.globeHalo{
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(245,203,105,.18), transparent 70%);
  filter:blur(10px);
}

.globe{
  width:155px;
  height:155px;
  border-radius:50%;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(circle at 30% 24%, #fff0bc, #c69032 45%, #6b4718 86%);
  box-shadow:
    inset -22px -16px 28px rgba(33,21,10,.8),
    inset 10px 10px 15px rgba(255,239,176,.30),
    0 0 35px rgba(212,160,48,.24);
}

.globe svg{
  width:100%;
  height:100%;
  display:block;
}

.strip{
  animation:spinWorld 54s linear infinite;
}

.land{
  fill:#77511c;
  opacity:.9;
}

@keyframes spinWorld{
  from{transform:translateX(0)}
  to{transform:translateX(-360px)}
}

.globe:after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 27% 22%, rgba(255,245,198,.42), transparent 30%),
    linear-gradient(90deg, transparent 34%, rgba(21,12,5,.48) 100%);
  pointer-events:none;
}

.globeLabel{
  margin-top:13px;
  color:#dcbb78;
  font-size:11px;
  letter-spacing:.28em;
}

/* GOLD MOUNTAIN */
.mountainWrap{
  position:relative;
  z-index:1;
  height:105px;
  margin-top:10px;
  overflow:hidden;
}

.mountainBase{
  position:absolute;
  inset:auto -18px 0 -18px;
  height:88px;
  background:
    linear-gradient(180deg, rgba(255,214,128,.04), rgba(255,214,128,.01)),
    linear-gradient(180deg, #53360d 0%, #8a5a16 32%, #c28729 70%, #6d4711 100%);
  clip-path:polygon(
    0% 100%, 0% 70%,
    10% 58%, 18% 65%, 28% 40%, 38% 58%,
    48% 22%, 58% 54%, 68% 34%, 77% 60%,
    86% 46%, 100% 70%, 100% 100%
  );
  opacity:.92;
  filter:drop-shadow(0 -3px 14px rgba(235,186,73,.14));
}

.mountainGlow{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:16px;
  width:230px;
  height:36px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,213,117,.30), transparent 72%);
  filter:blur(12px);
}

.nugget{
  position:absolute;
  bottom:24px;
  width:38px;
  height:22px;
  border-radius:40% 60% 52% 48% / 55% 45% 55% 45%;
  background:linear-gradient(145deg,#fff0b1,#e2af45 55%,#a86f1d 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  opacity:.95;
}
.n1{left:8%; transform:rotate(-10deg)}
.n2{left:23%; width:28px; height:18px; bottom:34px; transform:rotate(8deg)}
.n3{left:40%; width:46px; height:26px; bottom:48px; transform:rotate(-4deg)}
.n4{left:60%; width:30px; height:18px; bottom:38px; transform:rotate(11deg)}
.n5{left:76%; width:42px; height:23px; bottom:28px; transform:rotate(-8deg)}

.spark{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff2c0;
  box-shadow:0 0 12px rgba(255,236,170,.9);
  animation:twinkle 2.8s ease-in-out infinite;
}
.s1{left:20%; bottom:68px}
.s2{left:49%; bottom:82px; animation-delay:.5s}
.s3{left:76%; bottom:62px; animation-delay:1s}

@keyframes twinkle{
  0%,100%{opacity:.25; transform:scale(.9)}
  50%{opacity:1; transform:scale(1.35)}
}

/* SHARE BUTTON */
.share{
  width:100%;
  min-height:58px;
  margin-top:18px;
  border:0;
  border-radius:18px;
  background:var(--apple);
  color:#1b2c08;
  font-size:18px;
  font-weight:900;
  letter-spacing:.05em;
  cursor:pointer;
  box-shadow:0 9px 24px rgba(183,233,96,.22);
}

.share:active{transform:scale(.98)}

footer{
  margin-top:18px;
  color:#918876;
  font-size:10px;
  line-height:1.8;
}

@media (prefers-reduced-motion:reduce){
  .goldbar,.strip,.spark{animation:none!important}
}

@media (max-width:430px){
  .weights button{font-size:12px}
  .price{font-size:42px}
}
</style>
</head>
<body>

<div class="topGlow"></div>

<main>
  <h1>GOLD GLOBE</h1>
  <div class="tag">WORLD GOLD</div>

  <section class="panel">
    <div class="eyebrow">✦ LUXURY GOLD VIEW</div>

    <div class="barWrap">
      <div class="goldbar">
        <small>FINE GOLD</small>
        <strong id="barWeight">Ounce</strong>
        <small>999.9 · 24K GOLD</small>
      </div>
    </div>

    <div class="priceCaption">GLOBAL GOLD PRICE</div>
    <div class="price" id="price">—</div>
    <div class="unit" id="unit">USD / TROY OUNCE</div>
    <div class="status" id="status">Loading...</div>

    <div class="weights" id="weights"></div>

    <div class="globeArea">
      <div class="globeHalo"></div>
      <div class="globe">
        <svg viewBox="0 0 180 180" aria-hidden="true">
          <defs>
            <path id="worldPath"
              d="M12 45 L35 30 57 38 70 56 61 72 48 77 44 99 30 107 18 86 8 70Z
                 M54 107 L77 100 94 122 85 153 70 177 56 154 60 134Z
                 M105 37 L129 28 153 39 181 33 207 53 198 71 174 76 159 64 146 91 125 89 115 72 101 67Z
                 M124 101 L151 97 168 114 156 151 137 174 119 151 111 123Z
                 M190 145 L217 138 232 157 215 174 188 164Z
                 M248 42 L273 32 294 46 301 65 281 76 270 98 250 85 239 61Z
                 M267 107 L289 101 302 122 293 151 277 173 262 147Z
                 M307 38 L330 29 352 43 368 62 351 77 332 70 321 94 303 75Z
                 M322 104 L346 99 362 120 351 157 332 174 316 145Z"/>
          </defs>
          <g class="strip">
            <use href="#worldPath" class="land"></use>
            <use href="#worldPath" x="360" class="land"></use>
          </g>
        </svg>
      </div>
      <div class="globeLabel">WORLD GOLD</div>
    </div>

    <div class="mountainWrap" aria-hidden="true">
      <div class="mountainGlow"></div>
      <div class="mountainBase"></div>
      <div class="nugget n1"></div>
      <div class="nugget n2"></div>
      <div class="nugget n3"></div>
      <div class="nugget n4"></div>
      <div class="nugget n5"></div>
      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>
    </div>
  </section>

  <button class="share" id="share">↗ SHARE GOLD</button>

  <footer>
    Indicative gold spot value · USD only
    <div>Not a retail buying or selling quote</div>
  </footer>
</main>

<script>
const OZ = 31.1034768;

const choices = [
  ['1 kg', 1000],
  ['500 g', 500],
  ['250 g', 250],
  ['100 g', 100],
  ['50 g', 50],
  ['20 g', 20],
  ['10 g', 10],
  ['5 g', 5],
  ['1 g', 1],
  ['Ounce', OZ]
];

let ouncePrice = null;
let currentWeight = OZ;
let currentLabel = 'Ounce';

const priceEl = document.getElementById('price');
const statusEl = document.getElementById('status');
const unitEl = document.getElementById('unit');
const barWeightEl = document.getElementById('barWeight');
const weightsEl = document.getElementById('weights');

choices.forEach(([label, grams]) => {
  const button = document.createElement('button');
  button.textContent = label;
  button.dataset.label = label;
  button.setAttribute('aria-pressed', String(label === currentLabel));

  button.addEventListener('click', () => {
    currentWeight = grams;
    currentLabel = label;
    render();
  });

  weightsEl.appendChild(button);
});

function moneyUSD(value){
  return new Intl.NumberFormat('en-US', {
    style:'currency',
    currency:'USD',
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }).format(value);
}

function render(){
  barWeightEl.textContent = currentLabel;

  unitEl.textContent =
    currentLabel === 'Ounce'
      ? 'USD / TROY OUNCE'
      : 'USD / ' + currentLabel + ' · 24K';

  weightsEl.querySelectorAll('button').forEach(button => {
    const active = button.dataset.label === currentLabel;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });

  priceEl.textContent =
    ouncePrice === null
      ? '—'
      : moneyUSD(ouncePrice * currentWeight / OZ);
}

async function loadGold(){
  try{
    const response = await fetch('https://api.gold-api.com/price/XAU', {
      cache:'no-store'
    });

    if(!response.ok) throw new Error('network');

    const data = await response.json();
    const value = Number(data.price);

    if(!Number.isFinite(value) || value <= 0){
      throw new Error('invalid');
    }

    ouncePrice = value;

    const date = data.updatedAt ? new Date(data.updatedAt) : null;

    statusEl.textContent = date && !isNaN(date)
      ? 'Updated: ' + date.toLocaleString('en-GB', {
          dateStyle:'medium',
          timeStyle:'short',
          timeZone:'UTC'
        }) + ' UTC'
      : 'Latest available gold price';

    render();
  }catch(error){
    ouncePrice = null;
    render();
    statusEl.textContent = 'Price unavailable · Refresh to retry';
  }
}

document.getElementById('share').addEventListener('click', async () => {
  const url = location.href;
  const text = ouncePrice === null
    ? '✨ GOLD GLOBE'
    : '✨ GOLD GLOBE\n' + currentLabel + ': ' + (moneyUSD(ouncePrice * currentWeight / OZ));

  try{
    if(navigator.share){
      await navigator.share({
        title:'GOLD GLOBE',
        text,
        url
      });
      return;
    }
  }catch(error){
    if(error.name === 'AbortError') return;
  }

  window.open(
    'https://wa.me/?text=' + encodeURIComponent(text + '\n' + url),
    '_blank',
    'noopener'
  );
});

render();
loadGold();
</script>
</body>
</html>
